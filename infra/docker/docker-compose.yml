x-django-service: &django-service
  build:
    context: ../..
    dockerfile: infra/container/Dockerfile
  env_file:
    - ./.env.local
  restart: unless-stopped
  networks:
    - ocomme_internal
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M

services:
  db:
    image: postgres:17.2-bookworm
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ocomme_internal

  redis:
    image: redis:7.2-bookworm
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ocomme_internal

  web:
    <<: *django-service
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    command: >
      gunicorn --config python:gunicorn.conf
      config.wsgi:application

  celery:
    <<: *django-service
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A config worker -l info

  celery-beat:
    <<: *django-service
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A config beat -l info

networks:
  ocomme_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data: